name: Integrate Codex Web Platform

on:
  push:
    branches:
      - integration/codex-20260918-web-platform

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack staged payload
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/web_payload.part01               .integration/web_payload.part02a               .integration/web_payload.part02b               .integration/web_payload.part03               .integration/web_payload.part04 > /tmp/codex-web.b64
          base64 -d /tmp/codex-web.b64 > /tmp/codex-web.tar.gz
          tar -tzf /tmp/codex-web.tar.gz >/tmp/codex-web-files.txt
          test "$(wc -l </tmp/codex-web-files.txt)" -eq 42
          tar -xzf /tmp/codex-web.tar.gz -C .
          rm -f .integration/codex-web-platform.tar.gz.b64
          rm -f .integration/web_payload.part01 .integration/web_payload.part02                 .integration/web_payload.part02a .integration/web_payload.part02b                 .integration/web_payload.part03 .integration/web_payload.part04
          rm -f .github/workflows/integrate-codex-web-platform.yml
          rmdir .integration 2>/dev/null || true

      - name: Commit integrated web platform
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "integration: preserve Codex web API worker and bridge platform"
          git push origin HEAD:integration/codex-20260918-web-platform
