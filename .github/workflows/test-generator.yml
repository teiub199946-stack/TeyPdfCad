name: test-generator

on:
  push:
    branches:
      - feature/test-generator
      - feature/core-regression-integration
      - feature/test-003-error-classification
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/TESTING.md"
      - "Directory.Build.props"
      - "TeyPdfCad.sln"
      - ".github/workflows/test-generator.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore TeyPdfCad.sln

      - name: Build
        run: dotnet build TeyPdfCad.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TeyPdfCad.sln --configuration Release --no-build

      - name: Verify deterministic generator
        run: >
          dotnet run
          --project tests/TeyPdfCad.TestGenerator
          --configuration Release
          --no-build
          --
          verify
          --output artifacts/generated/ci

      - name: Semantic Core baseline - 100 cases
        run: >
          dotnet run
          --project tests/TeyPdfCad.TestGenerator
          --configuration Release
          --no-build
          --
          core-run
          --count 100
          --seed 12345
          --output artifacts/semantic-core/100

      - name: Semantic Core baseline - 1,000 cases
        run: >
          dotnet run
          --project tests/TeyPdfCad.TestGenerator
          --configuration Release
          --no-build
          --
          core-run
          --count 1000
          --seed 12345
          --output artifacts/semantic-core/1000

      - name: Semantic Core baseline - 10,000 cases
        run: >
          dotnet run
          --project tests/TeyPdfCad.TestGenerator
          --configuration Release
          --no-build
          --
          core-run
          --count 10000
          --seed 12345
          --output artifacts/semantic-core/10000

      - name: TEST-003 diagnostics - 100 cases
        run: >
          dotnet run
          --project tests/TeyPdfCad.TestGenerator
          --configuration Release
          --no-build
          --
          diagnose-core
          --count 100
          --seed 12345
          --output artifacts/test-003/100

      - name: TEST-003 diagnostics - 1,000 cases
        run: >
          dotnet run
          --project tests/TeyPdfCad.TestGenerator
          --configuration Release
          --no-build
          --
          diagnose-core
          --count 1000
          --seed 12345
          --output artifacts/test-003/1000

      - name: TEST-003 diagnostics - 10,000 cases
        run: >
          dotnet run
          --project tests/TeyPdfCad.TestGenerator
          --configuration Release
          --no-build
          --
          diagnose-core
          --count 10000
          --seed 12345
          --output artifacts/test-003/10000

      - name: Publish TEST-003 10,000-case summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/test-003/10000/report.md ]; then
            cat artifacts/test-003/10000/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload TEST-003 diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-003-diagnostics
          path: |
            artifacts/test-003/100/report.json
            artifacts/test-003/100/report.md
            artifacts/test-003/100/worst_cases.json
            artifacts/test-003/1000/report.json
            artifacts/test-003/1000/report.md
            artifacts/test-003/1000/worst_cases.json
            artifacts/test-003/10000/report.json
            artifacts/test-003/10000/report.md
            artifacts/test-003/10000/worst_cases.json
          if-no-files-found: error

      - name: Publish legacy 10,000-case summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/semantic-core/10000/report.md ]; then
            cat artifacts/semantic-core/10000/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Semantic Core regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-core-regression
          path: |
            artifacts/semantic-core/100/report.json
            artifacts/semantic-core/100/report.md
            artifacts/semantic-core/1000/report.json
            artifacts/semantic-core/1000/report.md
            artifacts/semantic-core/10000/report.json
            artifacts/semantic-core/10000/report.md
          if-no-files-found: error

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-generator-verification
          path: |
            artifacts/generated/ci/10000/report.json
            artifacts/generated/ci/10000/report.md
            artifacts/generated/ci/determinism/seed-12345.sha256
          if-no-files-found: warn
